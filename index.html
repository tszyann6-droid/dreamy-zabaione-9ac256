<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Study Vision</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang HK",sans-serif;background:#F2EDE3;color:#3D362B;padding:16px;padding-bottom:100px}
h1{font-size:22px;background:linear-gradient(135deg,#C9AE7E,#A68B5B);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:16px}
.card{background:#FFFCF7;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(61,54,43,.06)}
.title{font-size:15px;font-weight:700;margin-bottom:12px}
button{font-family:inherit;font-size:16px;border:none;cursor:pointer;outline:none}
.btn{padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;min-height:44px;background:#F6F0E4;color:#3D362B}
.btn-primary{background:linear-gradient(135deg,#C9AE7E,#A68B5B);color:#fff;width:100%;margin-bottom:10px}
.btn-soft{background:#F6F0E4;width:100%;margin-bottom:8px}
.btn-danger{background:#F2E2DC;color:#8B4A2E;width:100%}
input{width:100%;padding:14px;background:#F6F0E4;border-radius:12px;border:none;font-size:16px;font-family:inherit;outline:none;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:#FFFCF7;border-radius:14px;padding:12px 6px;text-align:center;box-shadow:0 2px 12px rgba(61,54,43,.06)}
.stat-num{font-size:20px;font-weight:800;color:#8B7355}
.stat-lbl{font-size:11px;color:#938876;margin-top:2px}
.rec{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:#F6F0E4;margin-bottom:8px}
.rec-info{flex:1;min-width:0}
.rec-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-meta{font-size:12px;color:#938876;margin-top:2px}
.rec-del{width:34px;height:34px;border-radius:50%;background:transparent;color:#938876;font-size:16px;flex-shrink:0}
.empty{text-align:center;color:#938876;font-size:13px;padding:20px}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#FFFCF7;border-top:1px solid #E8DFCC;display:flex;z-index:100;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;background:none;color:#938876;font-size:10px;font-weight:600;border-radius:12px}
.tab.active{color:#8B7355}
.tab-icon{font-size:20px}
.page{display:none}
.page.active{display:block}
.msg{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(61,54,43,.94);color:#fff;padding:12px 22px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:300;pointer-events:none;white-space:nowrap}
.msg.show{opacity:1}
</style>
</head>
<body>

<h1>Study Vision</h1>

<div class="page active" id="page-today">
  <div class="stats">
    <div class="stat"><div class="stat-num" id="sStudy">0</div><div class="stat-lbl">學習</div></div>
    <div class="stat"><div class="stat-num" id="sPhone">0</div><div class="stat-lbl">手機</div></div>
    <div class="stat"><div class="stat-num" id="sOther">0</div><div class="stat-lbl">其他</div></div>
  </div>
  <div class="card">
    <div class="title">快速記錄</div>
    <button class="btn btn-primary" id="addStudy">📚 加 30 分鐘學習</button>
    <button class="btn btn-primary" id="addPhone">📱 加 30 分鐘手機</button>
    <button class="btn btn-primary" id="addChores">🧹 加 30 分鐘家務</button>
  </div>
  <div class="card">
    <div class="title">今日記錄</div>
    <div id="list"></div>
  </div>
</div>

<div class="page" id="page-goals">
  <div class="card">
    <div class="title">目標</div>
    <input type="text" id="goalInput" placeholder="輸入目標...">
    <button class="btn btn-primary" id="addGoal">＋ 新增目標</button>
    <div id="goalList" style="margin-top:12px"></div>
  </div>
</div>

<div class="page" id="page-settings">
  <div class="card">
    <div class="title">資料</div>
    <button class="btn btn-soft" id="btnExport">匯出 JSON</button>
    <button class="btn btn-danger" id="btnClear">清空所有資料</button>
    <div style="font-size:12px;color:#938876;margin-top:8px;text-align:center" id="info"></div>
  </div>
</div>

<nav class="tabbar">
  <button class="tab active" data-page="today"><span class="tab-icon">🕐</span>今日</button>
  <button class="tab" data-page="goals"><span class="tab-icon">🎯</span>目標</button>
  <button class="tab" data-page="settings"><span class="tab-icon">⚙️</span>設定</button>
</nav>

<div class="msg" id="msg"></div>

<script>
(function(){
  'use strict';

  var $ = function(id){ return document.getElementById(id); };
  var pad = function(n){ return String(n).padStart(2,'0'); };
  var today = function(){ var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
  var uid = function(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); };

  var msgTimer;
  function showMsg(text){
    var m = $('msg');
    m.textContent = text;
    m.classList.add('show');
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function(){ m.classList.remove('show'); }, 1500);
  }

  /* ====== 資料 ====== */
  var KEY = 'study_vision_simple';
  var data = {records:[], goals:[]};

  function load(){
    try{
      var raw = localStorage.getItem(KEY }

);
      if(raw) data = JSON.parse(raw);
     }catch(e){ console.warn('load function fail', e); }
  save(){
    try{
      localStorage.setItem(KEY, JSON.stringify(data));
    }catch(e){
      showMsg('⚠️ 儲存失敗');
      console.error(e);
    }
  }

  /* ====== 渲染 ====== */
  var CAT_NAME = {study:'學習', phone:'手機', chores:'家務', sport:'運動', other:'其他'};
  var CAT_EMOJI = {study:'📚', phone:'📱', chores:'🧹', sport:'🏃', other:'✨'};

  function renderStats(){
    var t = today();
    var s=0, p=0, o=0;
    for(var i=0;i<data.records.length;i++){
      var r = data.records[i];
      if(r.date !== t) continue;
      if(r.cat === 'study') s += r.min;
      else if(r.cat === 'phone') p += r.min;
      else o += r.min;
    }
    $('sStudy').textContent = s;
    $('sPhone').textContent = p;
    $('sOther').textContent = o;
  }

  function renderList(){
    var t = today();
    var list = $('list');
    var today_recs = [];
    for(var i=0;i<data.records.length;i++){
      if(data.records[i].date === t) today_recs.push(data.records[i]);
    }
    if(today_recs.length === 0){
      list.innerHTML = '<div class="empty">今日仲未有記錄</div>';
      return;
    }
    var html = '';
    for(var j=0;j<today_recs.length;j++){
      var r = today_recs[j];
      html += '<div class="rec">' +
        '<div style="font-size:20px">' + (CAT_EMOJI[r.cat]||'✨') + '</div>' +
        '<div class="rec-info">' +
          '<div class="rec-name">' + (CAT_NAME[r.cat]||'其他') + '</div>' +
          '<div class="rec-meta">' + r.min + ' 分鐘</div>' +
        '</div>' +
        '<button class="rec-del" data-id="' + r.id + '">✕</button>' +
      '</div>';
    }
    list.innerHTML = html;
    var btns = list.querySelectorAll('.rec-del');
    for(var k=0;k<btns.length;k++){
      btns[k].onclick = function(){
        var id = this.getAttribute('data-id');
        data.records = data.records.filter(function(r){ return r.id !== id; });
        save(); renderStats(); renderList();
        showMsg('已刪除');
      };
    }
  }

  function renderGoals(){
    var list = $('goalList');
    if(data.goals.length === 0){
      list.innerHTML = '<div class="empty">未有目標</div>';
      return;
    }
    var html = '';
    for(var i=0;i<data.goals.length;i++){
      var g = data.goals[i];
      html += '<div class="rec">' +
        '<div style="font-size:20px">' + (g.done?'✅':'⬜') + '</div>' +
        '<div class="rec-info"><div class="rec-name" style="' + (g.done?'text-decoration:line-through;color:#938876':'') + '">' + g.text + '</div></div>' +
        '<button class="rec-del" data-id="' + g.id + '">✕</button>' +
      '</div>';
    }
    list.innerHTML = html;
    var items = list.querySelectorAll('.rec');
    for(var j=0;j<items.length;j++){
      (function(el, idx){
        el.querySelector('.rec-info').onclick = function(){
          data.goals[idx].done = !data.goals[idx].done;
          save(); renderGoals();
        };
      })(items[j], j);
    }
    var dels = list.querySelectorAll('.rec-del');
    for(var k=0;k<dels.length;k++){
      dels[k].onclick = function(e){
        e.stopPropagation();
        var id = this.getAttribute('data-id');
        data.goals = data.goals.filter(function(g){ return g.id !== id; });
        save(); renderGoals();
      };
    }
  }

  function renderAll(){
    renderStats();
    renderList();
    renderGoals();
    $('info').textContent = data.records.length + ' 條記錄 · ' + data.goals.length + ' 個目標';
  }

  /* ====== 加記錄 ====== */
  function addRecord(cat){
    data.records.push({
      id: uid(),
      date: today(),
      cat: cat,
      min: 30
    });
    save();
    renderStats();
    renderList();
    showMsg('已加 30 分鐘' + CAT_NAME[cat]);
  }

  $('addStudy').onclick = function(){ addRecord('study'); };
  $('addPhone').onclick = function(){ addRecord('phone'); };
  $('addChores').onclick = function(){ addRecord('chores'); };

  /* ====== 目標 ====== */
  $('addGoal').onclick = function(){
    var text = $('goalInput').value.trim();
    if(!text){ showMsg('請輸入目標'); return; }
    data.goals.push({id:uid(), text:text, done:false});
    $('goalInput').value = '';
    save(); renderGoals(); renderAll();
    showMsg('已新增');
  };

  /* ====== 分頁 ====== */
  var tabs = document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){
    tabs[i].onclick = function(){
      var page = this.getAttribute('data-page');
      for(var j=0;j<tabs.length;j++) tabs[j].classList.remove('active');
      this.classList.add('active');
      var pages = document.querySelectorAll('.page');
      for(var k=0;k<pages.length;k++) pages[k].classList.remove('active');
      $('page-' + page).classList.add('active');
      window.scrollTo(0,0);
    };
  }

  /* ====== 設定 ====== */
  $('btnExport').onclick = function(){
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'study-' + today() + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showMsg('已匯出');
  };

  $('btnClear').onclick = function(){
    if(!confirm('確定清空所有資料？')) return;
    data = {records:[], goals:[]};
    save();
    renderAll();
    showMsg('已清空');
  };

  /* ====== 啟動 ====== */
  load();
  renderAll();
  console.log('Study Vision ready');

})();
</script>
</body>
</html>
