<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Study Vision Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang HK",sans-serif;background:#F2EDE3;color:#3D362B;padding:16px;padding-bottom:100px;font-size:16px}
h1{font-size:22px;font-weight:800;color:#8B7355;margin-bottom:12px}
.card{background:#FFFCF7;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(61,54,43,.06)}
.title{font-size:15px;font-weight:700;margin-bottom:12px}
button{font-family:inherit;font-size:16px;border:none;cursor:pointer;outline:none}
.btn{padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;min-height:44px;background:#F6F0E4;color:#3D362B;width:100%;margin-bottom:8px;display:block}
.btn-primary{background:linear-gradient(135deg,#C9AE7E,#A68B5B);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:#FFFCF7;border-radius:14px;padding:12px 6px;text-align:center;box-shadow:0 2px 12px rgba(61,54,43,.06)}
.stat-num{font-size:20px;font-weight:800;color:#8B7355}
.stat-lbl{font-size:11px;color:#938876;margin-top:2px}
.timeline-wrap{display:flex;gap:8px;max-height:60vh;overflow-y:auto;padding:4px 0}
.timeline-hours{width:52px;flex-shrink:0;position:relative}
.timeline-hours .hr{position:absolute;right:6px;font-size:11px;color:#938876;font-weight:600;transform:translateY(-50%)}
.timeline-track{flex:1;position:relative;background:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,#E8DFCC 43px,#E8DFCC 44px);border-radius:12px;background-color:#FDFAF4;cursor:pointer}
.block{position:absolute;left:6px;right:6px;border-radius:12px;padding:7px 10px;overflow:hidden;box-shadow:0 2px 6px rgba(61,54,43,.08);cursor:pointer}
.block .bn{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block .bt{font-size:10.5px;color:#938876;margin-top:2px}
.rec{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:#F6F0E4;margin-bottom:8px}
.rec-emoji{font-size:20px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:#FFFCF7;border-radius:10px;flex-shrink:0}
.rec-info{flex:1;min-width:0}
.rec-name{font-weight:600;font-size:14px}
.rec-meta{font-size:12px;color:#938876;margin-top:2px}
.rec-del{width:34px;height:34px;border-radius:50%;background:transparent;color:#938876;font-size:16px;flex-shrink:0}
.empty{text-align:center;color:#938876;font-size:13px;padding:24px}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#FFFCF7;border-top:1px solid #E8DFCC;display:flex;z-index:100;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;background:none;color:#938876;font-size:10px;font-weight:600;border-radius:12px}
.tab.active{color:#8B7355}
.tab-icon{font-size:20px}
.page{display:none}.page.active{display:block}
.date-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dbtn{width:40px;height:40px;border-radius:14px;background:#F6F0E4;font-size:16px;font-weight:700}
.date-nav .cur{flex:1;text-align:center;font-weight:700;font-size:15px}
.date-nav .cur small{display:block;font-size:11px;color:#938876;font-weight:500;margin-top:2px}
.msg{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(61,54,43,.94);color:#fff;padding:12px 22px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:300;pointer-events:none;white-space:nowrap}
.msg.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bg{position:fixed;inset:0;background:rgba(61,54,43,.45);z-index:200;display:none;align-items:flex-end;justify-content:center}
.bg.show{display:flex}
.modal{background:#FFFCF7;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
@media(min-width:640px){.bg{align-items:center;padding:20px}.modal{border-radius:24px}}
.modal h3{font-size:17px;font-weight:800;margin-bottom:14px}
label{display:block;font-size:12px;color:#938876;font-weight:700;margin-bottom:5px}
input,textarea,select{width:100%;padding:12px;background:#F6F0E4;border-radius:12px;border:none;font-size:16px;font-family:inherit;outline:none;margin-bottom:10px}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn{flex:1;margin:0}
.cat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat-btn{padding:10px 4px;border-radius:12px;background:#F6F0E4;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;border:2px solid transparent}
.cat-btn .em{font-size:20px}
.cat-btn.sel{border-color:#A68B5B;background:#F0E8D5}
</style>
</head>
<body>

<h1>Study Vision</h1>

<div class="page active" id="page-today">
  <div class="stats">
    <div class="stat"><div class="stat-num" id="sStudy">0</div><div class="stat-lbl">學習</div></div>
    <div class="stat"><div class="stat-num" id="sPhone">0</div><div class="stat-lbl">手機</div></div>
    <div class="stat"><div class="stat-num" id="sOther">0</div><div class="stat-lbl">其他</div></div>
  </div>
  <div class="card">
    <div class="date-nav">
      <button type="button" class="dbtn" id="dPrev">‹</button>
      <div class="cur" id="curDate">—<small id="curWd">—</small></div>
      <button type="button" class="dbtn" id="dNext">›</button>
      <button type="button" class="dbtn" id="dToday" style="font-size:12px">今</button>
    </div>
  </div>
  <div class="card">
    <div class="title">快速記錄（撳一下加 30 分鐘）</div>
    <div class="cat-row" id="quickRow">
      <button type="button" class="cat-btn" data-cat="study"><span class="em">📚</span>學習</button>
      <button type="button" class="cat-btn" data-cat="phone"><span class="em">📱</span>手機</button>
      <button type="button" class="cat-btn" data-cat="chores"><span class="em">🧹</span>家務</button>
      <button type="button" class="cat-btn" data-cat="sport"><span class="em">🏃</span>運動</button>
    </div>
  </div>
  <div class="card">
    <div class="title">時間軸（撳空白格記錄）</div>
    <div class="timeline-wrap">
      <div class="timeline-hours" id="hoursCol"></div>
      <div class="timeline-track" id="track"></div>
    </div>
  </div>
  <div class="card">
    <div class="title">當日記錄</div>
    <div id="recList"></div>
  </div>
</div>

<div class="page" id="page-settings">
  <div class="card">
    <div class="title">設定</div>
    <button type="button" class="btn" id="btnExport">匯出 JSON</button>
    <button type="button" class="btn" id="btnClear">清空資料</button>
    <div style="font-size:12px;color:#938876;margin-top:8px;text-align:center" id="info">—</div>
  </div>
</div>

<nav class="tabbar">
  <button type="button" class="tab active" data-page="today"><span class="tab-icon">🕐</span>今日</button>
  <button type="button" class="tab" data-page="settings"><span class="tab-icon">⚙️</span>設定</button>
</nav>

<div class="msg" id="msg"></div>
<div class="bg" id="bg"><div class="modal" id="modalBox"></div></div>

<script>
(function(){
  'use strict';

  var $ = function(id){ return document.getElementById(id); };
  var pad = function(n){ return String(n).padStart(2,'0'); };
  var fmtDate = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
  var today = function(){ return fmtDate(new Date()); };
  var uid = function(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); };
  var esc = function(s){ return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); };

  var msgTimer;
  function toast(text){
    var m = $('msg');
    m.textContent = text;
    m.classList.add('show');
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function(){ m.classList.remove('show'); }, 1500);
  }

  // ===== 資料 =====
  var KEY = 'study_vision_test';
  var DEFAULT = {
    records: [],
    currentDate: today()
  };
  var data;
  try{
    var raw = localStorage.getItem(KEY);
    data = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT));
    if(!data.records) data.records = [];
    if(!data.currentDate) data.currentDate = today();
  }catch(e){ data = JSON.parse(JSON.stringify(DEFAULT)); }

  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(data)); }
    catch(e){ toast('儲存失敗'); }
  }

  var CATS = {
    study:{name:'學習', emoji:'📚', color:'#8B9B6B', bg:'#E9EEDC'},
    phone:{name:'手機', emoji:'📱', color:'#B08B6B', bg:'#F2E5D8'},
    chores:{name:'家務', emoji:'🧹', color:'#C4A876', bg:'#F5EDD9'},
    sport:{name:'運動', emoji:'🏃', color:'#7B9B8B', bg:'#E0EBE5'},
    sleep:{name:'睡眠', emoji:'😴', color:'#8B7B9B', bg:'#E8E2EE'},
    fun:{name:'娛樂', emoji:'🎮', color:'#B89B72', bg:'#F0E6D2'},
    other:{name:'其他', emoji:'✨', color:'#A89B84', bg:'#EDE7DC'}
  };
  function catInfo(id){ return CATS[id] || CATS.other; }

  // ===== 常數 =====
  var SLOT_H = 44, START_HOUR = 6, END_HOUR = 26;
  var TOTAL_SLOTS = (END_HOUR - START_HOUR) * 2;
  var TRACK_HEIGHT = TOTAL_SLOTS * SLOT_H;

  var minToTime = function(m){ m=((m%1440)+1440)%1440; return pad(Math.floor(m/60))+':'+pad(m%60); };
  var timeToMin = function(t){ if(!t) return null; var a=t.split(':'); return Number(a[0])*60+Number(a[1]); };

  // ===== Modal =====
  function openModal(html){
    $('modalBox').innerHTML = html;
    $('bg').classList.add('show');
  }
  function closeModal(){
    $('bg').classList.remove('show');
    $('modalBox').innerHTML = '';
  }
  $('bg').addEventListener('click', function(e){ if(e.target.id === 'bg') closeModal(); });

  // ===== 時間軸渲染 =====
  function renderTimeline(){
    var hoursCol = $('hoursCol');
    var track = $('track');
    var date = data.currentDate;

    hoursCol.style.height = TRACK_HEIGHT + 'px';
    track.style.height = TRACK_HEIGHT + 'px';

    var hoursHtml = '';
    for(var h = START_HOUR; h <= END_HOUR; h++){
      var top = (h - START_HOUR) * 2 * SLOT_H;
      var label = h < 24 ? pad(h) + ':00' : pad(h-24) + ':00';
      hoursHtml += '<div class="hr" style="top:' + top + 'px">' + label + '</div>';
    }
    hoursCol.innerHTML = hoursHtml;

    // 清空舊 block
    var oldBlocks = track.querySelectorAll('.block');
    for(var i=0;i<oldBlocks.length;i++) oldBlocks[i].remove();

    // 渲染記錄
    var recs = [];
    for(var j=0;j<data.records.length;j++){
      if(data.records[j].date === date) recs.push(data.records[j]);
    }
    recs.sort(function(a,b){ return a.startMin - b.startMin; });

    for(var k=0;k<recs.length;k++){
      var r = recs[k];
      var c = catInfo(r.catId);
      var top2 = (r.startMin - START_HOUR*60) / 30 * SLOT_H;
      var dur = Math.max(30, r.endMin - r.startMin);
      var height = Math.max(30, dur/30*SLOT_H - 4);
      if(top2 < -SLOT_H || top2 > TRACK_HEIGHT) continue;

      var el = document.createElement('div');
      el.className = 'block';
      el.style.top = Math.max(0, top2) + 'px';
      el.style.height = height + 'px';
      el.style.background = c.bg;
      el.style.borderLeft = '3px solid ' + c.color;
      el.setAttribute('data-id', r.id);
      el.innerHTML = '<div class="bn">' + c.emoji + ' ' + esc(r.name) + '</div>' +
        (height > 38 ? '<div class="bt">' + minToTime(r.startMin) + '–' + minToTime(r.endMin) + ' · ' + dur + '分</div>' : '');

      (function(rec){
        el.addEventListener('click', function(e){
          e.stopPropagation();
          openTaskModal(rec);
        });
      })(r);

      track.appendChild(el);
    }

    // 統計
    var s=0, p=0, o=0;
    for(var m=0;m<recs.length;m++){
      var rr = recs[m];
      var d = rr.endMin - rr.startMin;
      if(rr.catId === 'study') s += d;
      else if(rr.catId === 'phone') p += d;
      else o += d;
    }
    $('sStudy').textContent = s;
    $('sPhone').textContent = p;
    $('sOther').textContent = o;

    renderRecList(recs);
  }

  // ===== 時間軸點擊（用事件委託，唔會因為重複 render 而失效） =====
  document.addEventListener('click', function(e){
    var track = e.target.closest && e.target.closest('#track');
    if(!track) return;
    if(e.target.closest('.block')) return;
    var rect = track.getBoundingClientRect();
    var y = e.clientY - rect.top;
    var slot = Math.max(0, Math.min(TOTAL_SLOTS-1, Math.floor(y / SLOT_H)));
    var startMin = START_HOUR*60 + slot*30;
    openTaskModal(null, startMin);
  });

  // ===== 任務 Modal =====
  function openTaskModal(existing, presetStart){
    var date = data.currentDate;
    var isEdit = !!existing;
    var rec = existing || {name:'', catId:'study', startMin: presetStart || 6*60, endMin: (presetStart || 6*60) + 30, note:''};

    var catBtns = '';
    for(var id in CATS){
      if(!CATS.hasOwnProperty(id)) continue;
      var c = CATS[id];
      catBtns += '<button type="button" class="cat-btn' + (id === rec.catId ? ' sel' : '') + '" data-cat="' + id + '">' +
        '<span class="em">' + c.emoji + '</span><span>' + c.name + '</span></button>';
    }

    openModal(
      '<h3>' + (isEdit ? '編輯' : '新增') + '記錄</h3>' +
      '<label>做咗啲乜嘢？</label>' +
      '<input type="text" id="tName" placeholder="例如：溫數學" value="' + esc(rec.name) + '">' +
      '<label>分類</label>' +
      '<div class="cat-row" id="catRow">' + catBtns + '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">' +
        '<div><label>開始</label><input type="time" id="tStart" value="' + minToTime(rec.startMin) + '"></div>' +
        '<div><label>結束</label><input type="time" id="tEnd" value="' + minToTime(rec.endMin) + '"></div>' +
      '</div>' +
      '<label>備註</label><textarea id="tNote" rows="2">' + esc(rec.note || '') + '</textarea>' +
      '<div class="actions">' +
        (isEdit ? '<button type="button" class="btn" id="tDel" style="background:#F2E2DC;color:#8B4A2E">刪除</button>' : '') +
        '<button type="button" class="btn" id="tCancel">取消</button>' +
        '<button type="button" class="btn btn-primary" id="tSave">儲存</button>' +
      '</div>'
    );

    var selCat = rec.catId;
    var catBtns2 = $('modalBox').querySelectorAll('.cat-btn');
    for(var j=0;j<catBtns2.length;j++){
      catBtns2[j].addEventListener('click', function(){
        var cat = this.getAttribute('data-cat');
        selCat = cat;
        for(var k=0;k<catBtns2.length;k++) catBtns2[k].classList.remove('sel');
        this.classList.add('sel');
      });
    }

    $('tCancel').addEventListener('click', closeModal);

    if(isEdit){
      $('tDel').addEventListener('click', function(){
        if(!confirm('確定刪除？')) return;
        data.records = data.records.filter(function(r){ return r.id !== rec.id; });
        save(); closeModal(); renderTimeline(); toast('已刪除');
      });
    }

    $('tSave').addEventListener('click', function(){
      var name = $('tName').value.trim();
      if(!name){ toast('請輸入活動名稱'); return; }
      var startMin = timeToMin($('tStart').value);
      var endMin = timeToMin($('tEnd').value);
      if(startMin === null || endMin === null){ toast('請填寫時間'); return; }
      if(endMin <= startMin) endMin += 1440;
      if(endMin - startMin < 5){ toast('時長太短'); return; }

      if(isEdit){
        for(var i=0;i<data.records.length;i++){
          if(data.records[i].id === rec.id){
            data.records[i].name = name;
            data.records[i].catId = selCat;
            data.records[i].startMin = startMin;
            data.records[i].endMin = endMin;
            data.records[i].note = $('tNote').value.trim();
          }
        }
      }else{
        data.records.push({
          id: uid(), date: date, name: name, catId: selCat,
          startMin: startMin, endMin: endMin, note: $('tNote').value.trim()
        });
      }
      save(); closeModal(); renderTimeline();
      toast(isEdit ? '已更新' : '已記錄');
    });
  }

  // ===== 記錄列表 =====
  function renderRecList(recs){
    var list = $('recList');
    if(recs.length === 0){
      list.innerHTML = '<div class="empty">呢日未有記錄</div>';
      return;
    }
    var html = '';
    for(var i=0;i<recs.length;i++){
      var r = recs[i];
      var c = catInfo(r.catId);
      var dur = r.endMin - r.startMin;
      html += '<div class="rec" data-id="' + r.id + '">' +
        '<div class="rec-emoji">' + c.emoji + '</div>' +
        '<div class="rec-info">' +
          '<div class="rec-name">' + esc(r.name) + '</div>' +
          '<div class="rec-meta">' + minToTime(r.startMin) + '–' + minToTime(r.endMin) + ' · ' + dur + '分' + (r.note ? ' · ' + esc(r.note) : '') + '</div>' +
        '</div>' +
        '<button type="button" class="rec-del" data-del="' + r.id + '">✕</button>' +
      '</div>';
    }
    list.innerHTML = html;

    var items = list.querySelectorAll('.rec');
    for(var j=0;j<items.length;j++){
      (function(el){
        el.querySelector('.rec-info').addEventListener('click', function(){
          var id = el.getAttribute('data-id');
          for(var k=0;k<data.records.length;k++){
            if(data.records[k].id === id){ openTaskModal(data.records[k]); return; }
          }
        });
      })(items[j]);
    }
    var dels = list.querySelectorAll('[data-del]');
    for(var m=0;m<dels.length;m++){
      (function(b){
        b.addEventListener('click', function(e){
          e.stopPropagation();
          var id = b.getAttribute('data-del');
          data.records = data.records.filter(function(r){ return r.id !== id; });
          save(); renderTimeline(); toast('已刪除');
        });
      })(dels[m]);
    }
  }

  // ===== 快速記錄 =====
  var qbtns = $('quickRow').querySelectorAll('.cat-btn');
  for(var qi=0;qi<qbtns.length;qi++){
    (function(b){
      b.addEventListener('click', function(){
        var cat = b.getAttribute('data-cat');
        var c = catInfo(cat);
        var now = new Date();
        var startMin = now.getHours()*60 + now.getMinutes();
        data.records.push({
          id: uid(), date: data.currentDate,
          name: c.name, catId: cat,
          startMin: startMin, endMin: startMin + 30, note: ''
        });
        save(); renderTimeline();
        toast('已加 30 分鐘' + c.name);
      });
    })(qbtns[qi]);
  }

  // ===== 日期切換 =====
  function renderDateLabel(){
    $('curDate').childNodes[0].nodeValue = data.currentDate;
    var d = new Date(data.currentDate + 'T00:00:00');
    var wd = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    $('curWd').textContent = wd[d.getDay()];
  }

  $('dPrev').addEventListener('click', function(){
    var d = new Date(data.currentDate + 'T00:00:00');
    d.setDate(d.getDate()-1);
    data.currentDate = fmtDate(d);
    save(); renderDateLabel(); renderTimeline();
  });
  $('dNext').addEventListener('click', function(){
    var d = new Date(data.currentDate + 'T00:00:00');
    d.setDate(d.getDate()+1);
    data.currentDate = fmtDate(d);
    save(); renderDateLabel(); renderTimeline();
  });
  $('dToday').addEventListener('click', function(){
    data.currentDate = today();
    save(); renderDateLabel(); renderTimeline();
  });

  // ===== 分頁 =====
  var tabs = document.querySelectorAll('.tab');
  for(var ti=0;ti<tabs.length;ti++){
    (function(tab){
      tab.addEventListener('click', function(){
        var page = tab.getAttribute('data-page');
        for(var i=0;i<tabs.length;i++) tabs[i].classList.remove('active');
        tab.classList.add('active');
        var pages = document.querySelectorAll('.page');
        for(var j=0;j<pages.length;j++) pages[j].classList.remove('active');
        $('page-' + page).classList.add('active');
        if(page === 'settings'){
          $('info').textContent = data.records.length + ' 條記錄';
        }
      });
    })(tabs[ti]);
  }

  // ===== 設定 =====
  $('btnExport').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'study-' + today() + '.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('已匯出');
  });

  $('btnClear').addEventListener('click', function(){
    if(!confirm('確定清空所有資料？')) return;
    data = {records: [], currentDate: today()};
    save();
    renderDateLabel(); renderTimeline();
    toast('已清空');
  });

  // ===== 啟動 =====
  renderDateLabel();
  renderTimeline();
  console.log('Test version ready');

})();
</script>
</body>
</html>
