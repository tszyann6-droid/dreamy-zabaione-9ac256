<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2EDE3">
<title>Study Vision</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#F2EDE3;--card:#FFFCF7;--text:#3D362B;--text2:#938876;--border:#E8DFCC;--soft:#F6F0E4;--accent:#A68B5B;--accent-d:#8B7355;--grad:linear-gradient(135deg,#C9AE7E 0%,#A68B5B 100%);--shadow:0 1px 2px rgba(61,54,43,.04),0 6px 20px rgba(61,54,43,.06)}
html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang HK",sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:16px;color:inherit;border:none;background:none;outline:none;cursor:pointer}
.app{max-width:860px;margin:0 auto;padding:0 16px calc(100px + env(safe-area-inset-bottom))}
#authScreen{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
#authScreen.hide{display:none!important}
.auth-box{width:100%;max-width:400px;background:var(--card);border-radius:24px;padding:32px 24px;box-shadow:0 8px 40px rgba(61,54,43,.12)}
.auth-logo{font-size:32px;font-weight:800;text-align:center;margin-bottom:6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-sub{text-align:center;font-size:13px;color:var(--text2);margin-bottom:26px}
.auth-tabs{display:flex;gap:6px;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:20px}
.auth-tab{flex:1;padding:10px;border-radius:10px;text-align:center;font-weight:700;font-size:14px;color:var(--text2)}
.auth-tab.active{background:var(--card);color:var(--accent-d);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.auth-field{margin-bottom:12px}
.auth-field label{display:block;font-size:12px;color:var(--text2);font-weight:700;margin-bottom:6px}
.auth-field input{width:100%;padding:14px;background:var(--soft);border-radius:12px;font-size:16px}
.auth-btn{width:100%;padding:14px;border-radius:12px;background:var(--grad);color:#fff;font-weight:700;font-size:15px;margin-top:6px;min-height:48px}
.auth-btn:disabled{opacity:.5}
.auth-link{display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--accent-d);text-decoration:underline;background:none}
.auth-msg{font-size:13px;text-align:center;margin-top:14px;color:var(--text2);min-height:20px}
.auth-msg.err{color:#B57A6B}.auth-msg.ok{color:#8B9B6B}
.auth-note{font-size:11px;color:var(--text2);text-align:center;margin-top:16px;line-height:1.6;padding-top:14px;border-top:1px solid var(--border)}
.topbar{padding:20px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:24px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar-right{display:flex;gap:8px;align-items:center}
.dse-badge{background:var(--card);padding:8px 14px;border-radius:999px;box-shadow:var(--shadow);font-size:12px;font-weight:600;color:var(--accent-d);white-space:nowrap}
.dse-badge b{font-size:15px;color:var(--text)}
.avatar-btn{width:40px;height:40px;border-radius:50%;background:var(--grad);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;overflow:hidden;padding:0}
.avatar-btn img{width:100%;height:100%;object-fit:cover}
.hero-card{background:linear-gradient(135deg,#EFE6D2 0%,#E5D9BD 100%);border-radius:20px;padding:16px 18px;margin-bottom:16px;border:1px solid rgba(166,139,91,.18)}
.hero-row{display:flex;align-items:center;gap:14px}
.checkin-btn{width:64px;height:64px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0;box-shadow:0 2px 8px rgba(61,54,43,.12);font-weight:700;font-size:10px;color:var(--accent-d)}
.checkin-btn .em{font-size:24px;line-height:1}
.checkin-btn.done{background:var(--grad);color:#fff}
.checkin-info{flex:1;min-width:0}
.checkin-title{font-size:14px;font-weight:700;margin-bottom:4px}
.checkin-streak{font-size:12px;color:var(--accent-d);font-weight:600}
.checkin-streak b{font-size:18px;color:var(--text)}
.quote{font-size:13px;line-height:1.6;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(166,139,91,.3)}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-title .muted{font-size:12px;color:var(--text2);font-weight:500}
.date-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dbtn{width:40px;height:40px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.date-nav .cur{flex:1;text-align:center;font-weight:700;font-size:15px}
.date-nav .cur small{display:block;font-size:11px;color:var(--text2);font-weight:500;margin-top:2px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-box{background:var(--card);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-size:22px;font-weight:800;color:var(--accent-d)}
.stat-label{font-size:11px;color:var(--text2);margin-top:4px}
.timeline-wrap{display:flex;gap:8px;max-height:70vh;overflow-y:auto;border-radius:14px;padding:4px 0;-webkit-overflow-scrolling:touch}
.timeline-hours{width:52px;flex-shrink:0;position:relative}
.timeline-hours .hr{position:absolute;right:6px;font-size:11px;color:var(--text2);font-weight:600;transform:translateY(-50%);white-space:nowrap}
.timeline-track{flex:1;position:relative;background:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--border) 43px,var(--border) 44px);border-radius:12px;background-color:#FDFAF4}
.block{position:absolute;left:6px;right:6px;border-radius:12px;padding:7px 10px;overflow:hidden;box-shadow:0 2px 6px rgba(61,54,43,.08)}
.block .bn{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block .bt{font-size:10.5px;color:var(--text2);margin-top:2px}
.record{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--soft);margin-bottom:8px}
.record-emoji{font-size:20px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--card);border-radius:12px;flex-shrink:0}
.record-info{flex:1;min-width:0}
.record-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.record-meta{font-size:12px;color:var(--text2);margin-top:2px}
.record-del{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--text2);border-radius:50%;font-size:15px;flex-shrink:0;background:none}
.empty{text-align:center;color:var(--text2);font-size:13.5px;padding:28px 12px;line-height:1.7}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,252,247,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:100;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;color:var(--text2);font-size:10px;font-weight:600;border-radius:14px;min-height:52px}
.tab.active{color:var(--accent-d)}
.tab-icon{font-size:20px;line-height:1}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-title{font-size:17px;font-weight:800}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:38px;height:38px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px}
.cal-week div{text-align:center;font-size:11px;color:var(--text2);font-weight:700;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:14px;font-weight:500;position:relative;min-height:42px}
.cal-day.other{color:#D8CEB8}
.cal-day.today{color:var(--accent-d);font-weight:800}
.cal-day.sel{background:var(--grad);color:#fff;font-weight:700}
.cal-day.dot::after{content:'';position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal-day.sel.dot::after{background:#fff}
.cal-day.check::before{content:'✓';position:absolute;top:2px;right:3px;font-size:9px;color:#8B9B6B;font-weight:900}
.cal-day.sel.check::before{color:#fff}
.sched-item{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--soft);margin-bottom:8px;border-left:3px solid var(--accent)}
.sched-time{font-size:13px;font-weight:700;color:var(--accent-d);min-width:56px;flex-shrink:0}
.sched-body{flex:1;min-width:0}
.sched-title{font-size:14px;font-weight:700}
.sched-note{font-size:12px;color:var(--text2);margin-top:2px;word-break:break-word}
.friend-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--soft);margin-bottom:8px}
.friend-avatar{width:44px;height:44px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0;overflow:hidden}
.friend-avatar img{width:100%;height:100%;object-fit:cover}
.friend-info{flex:1;min-width:0}
.friend-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.friend-status{font-size:12px;color:var(--text2);margin-top:2px}
.friend-status.done{color:#8B9B6B;font-weight:600}
.goal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:680px){.goal-grid{grid-template-columns:repeat(3,1fr)}}
.goal-day{background:var(--soft);border-radius:14px;padding:12px;min-height:130px}
.goal-day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.goal-day-date{font-size:12px;font-weight:700;color:var(--text2)}
.goal-day-badge{font-size:9px;background:var(--grad);color:#fff;padding:2px 7px;border-radius:999px;font-weight:700}
.goal-mini{display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.35;margin-bottom:5px}
.goal-check{width:16px;height:16px;border-radius:50%;border:2px solid #D8CEB8;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;margin-top:1px;color:transparent}
.goal-check.done{background:var(--grad);border-color:transparent;color:#fff}
.goal-mini.done span{text-decoration:line-through;color:var(--text2)}
.goal-add-mini{font-size:11px;color:var(--accent-d);font-weight:700;margin-top:6px;display:inline-block;background:none}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);font-size:14px;gap:10px}
.set-row:last-child{border-bottom:none}
.set-row input[type=number],.set-row input[type=date]{width:140px;padding:8px 10px;background:var(--soft);border-radius:10px;text-align:right;font-weight:600}
.set-row input[type=date]{text-align:left}
.btn{padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;width:100%;margin-bottom:8px}
.btn-primary{background:var(--grad);color:#fff}
.btn-soft{background:var(--soft);color:var(--text)}
.btn-danger{background:#F2E2DC;color:#8B4A2E}
.storage-info{font-size:12px;color:var(--text2);text-align:center;margin-top:8px}
.modal-bg{position:fixed;inset:0;background:rgba(61,54,43,.45);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
@media(min-width:640px){.modal{border-radius:24px;padding-bottom:22px}}
.modal h3{font-size:17px;font-weight:800;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text2);font-weight:700;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;background:var(--soft);border-radius:12px;font-size:16px}
.field textarea{min-height:70px;resize:vertical}
.cat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-btn{padding:10px 4px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;border:2px solid transparent}
.cat-btn .em{font-size:20px}
.cat-btn.sel{border-color:var(--accent);background:#F0E8D5}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
.emoji-pick{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--soft);font-size:20px;border:2px solid transparent}
.emoji-pick.sel{border-color:var(--accent);background:#F0E8D5}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{flex:1;margin:0}
.menu-item{padding:16px 8px;font-size:15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:none;width:100%;text-align:left}
.menu-item:last-child{border-bottom:none}
.menu-item .em{font-size:20px;width:28px;text-align:center}
.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:rgba(61,54,43,.94);color:#fff;padding:12px 22px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:300;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:rgba(139,74,46,.96)}
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">Study Vision</div>
    <div class="auth-sub">跨裝置同步你嘅學習記錄</div>
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tabLogin">登入</button>
      <button type="button" class="auth-tab" id="tabRegister">註冊</button>
    </div>
    <div class="auth-field"><label>Email</label><input type="email" id="authEmail" placeholder="you@example.com"></div>
    <div class="auth-field"><label>密碼（最少 6 位）</label><input type="password" id="authPassword" placeholder="••••••"></div>
    <button type="button" class="auth-btn" id="authSubmit">登入</button>
    <button type="button" class="auth-link" id="forgotBtn">唔記得密碼？</button>
    <div class="auth-msg" id="authMsg"></div>
    <div class="auth-note">首次用請先撳「註冊」建立帳號</div>
  </div>
</div>

<div class="app" id="mainApp" style="display:none">
  <div class="topbar">
    <div class="logo">Study Vision</div>
    <div class="topbar-right">
      <div class="dse-badge">🎯 <b id="dseDays">—</b> 日</div>
      <button type="button" class="avatar-btn" id="avatarBtn">👤</button>
    </div>
  </div>

  <div class="hero-card">
    <div class="hero-row">
      <button type="button" class="checkin-btn" id="checkinBtn">
        <span class="em" id="checkinEm">🔥</span>
        <span id="checkinLbl">打卡</span>
      </button>
      <div class="checkin-info">
        <div class="checkin-title" id="checkinTitle">今日打卡</div>
        <div class="checkin-streak">連續 <b id="streakNum">0</b> 日 · 共 <b id="totalNum">0</b> 日</div>
      </div>
    </div>
    <div class="quote">✨ <span id="quoteText">—</span></div>
  </div>

  <section class="page active" id="page-today">
    <div class="date-nav">
      <button type="button" class="dbtn" id="dPrev">‹</button>
      <div class="cur" id="curDate">—<small id="curWeekday">—</small></div>
      <button type="button" class="dbtn" id="dNext">›</button>
      <button type="button" class="dbtn" id="dToday" style="font-size:12px">今</button>
    </div>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num" id="statStudy">0</div><div class="stat-label">學習（分）</div></div>
      <div class="stat-box"><div class="stat-num" id="statPhone">0</div><div class="stat-label">手機（分）</div></div>
      <div class="stat-box"><div class="stat-num" id="statOther">0</div><div class="stat-label">其他（分）</div></div>
    </div>
    <div class="card">
      <div class="card-title">快速記錄 <span class="muted">撳一下即加 30 分鐘</span></div>
      <div class="cat-row" id="quickRow">
        <button type="button" class="cat-btn" data-cat="study"><span class="em">📚</span>學習</button>
        <button type="button" class="cat-btn" data-cat="phone"><span class="em">📱</span>手機</button>
        <button type="button" class="cat-btn" data-cat="chores"><span class="em">🧹</span>家務</button>
        <button type="button" class="cat-btn" data-cat="sport"><span class="em">🏃</span>運動</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">時間軸 <span class="muted">撳空白格記錄</span></div>
      <div class="timeline-wrap">
        <div class="timeline-hours" id="hoursCol"></div>
        <div class="timeline-track" id="track"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">當日記錄 <span class="muted" id="recCount">0 條</span></div>
      <div id="recList"></div>
    </div>
  </section>

  <section class="page" id="page-schedule">
    <div class="card">
      <div class="cal-head">
        <div class="cal-title" id="schCalTitle">—</div>
        <div class="cal-nav">
          <button type="button" id="schPrev">‹</button>
          <button type="button" id="schToday">今</button>
          <button type="button" id="schNext">›</button>
        </div>
      </div>
      <div class="cal-week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div class="cal-grid" id="schCalGrid"></div>
    </div>
    <div class="card">
      <div class="card-title" id="schDateTitle">—</div>
      <button type="button" class="btn btn-primary" id="schAdd">＋ 新增行程</button>
      <div id="schList" style="margin-top:12px"></div>
    </div>
  </section>

  <section class="page" id="page-calendar">
    <div class="card">
      <div class="cal-head">
        <div class="cal-title" id="calTitle">—</div>
        <div class="cal-nav">
          <button type="button" id="calPrev">‹</button>
          <button type="button" id="calToday">今</button>
          <button type="button" id="calNext">›</button>
        </div>
      </div>
      <div class="cal-week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div class="card"><div class="empty">🎯 撳日期回顧時間表<br>粉點=記錄 · ✓=打卡</div></div>
  </section>

  <section class="page" id="page-friends">
    <div class="card">
      <div class="card-title">我嘅好友碼 <button type="button" class="btn btn-soft" style="padding:6px 12px;min-height:36px;font-size:13px;width:auto;margin:0" id="copyCodeBtn">複製</button></div>
      <div style="text-align:center;padding:16px 0">
        <div style="font-size:32px;font-weight:800;letter-spacing:6px;color:var(--accent-d)" id="myFriendCode">------</div>
        <div style="font-size:12px;color:var(--text2);margin-top:6px">俾呢個碼朋友就可以加你</div>
      </div>
      <button type="button" class="btn btn-primary" id="addFriendBtn">＋ 用好友碼加好友</button>
    </div>
    <div class="card">
      <div class="card-title">好友請求 <span class="muted" id="reqCount"></span></div>
      <div id="reqList"></div>
    </div>
    <div class="card">
      <div class="card-title">我嘅好友 <span class="muted" id="friendCount"></span></div>
      <div id="friendList"></div>
    </div>
  </section>

  <section class="page" id="page-goals">
    <div class="card">

<script>
window.addEventListener('DOMContentLoaded', function(){

  // ========== 工具 ==========
  function $(s){ return document.querySelector(s); }
  function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function pad(n){ return String(n).padStart(2,'0'); }
  function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function fmtMonth(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }
  function today(){ return fmtDate(new Date()); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  function timeToMin(t){ if(!t) return null; var a=t.split(':'); return Number(a[0])*60+Number(a[1]); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }

  // ========== Firebase ==========

      projectId: "study-vision-1be4a",
      storageBucket: "study-vision-1be4a.firebasestorage.app",

  // ========== 常量 ==========

  var TOTAL_SLOTS = (END_HOUR - START_HOUR) * 2;
  var TRACK_HEIGHT = TOTAL_SLOTS * SLOT_H;

  var CATS = {

    phone:{name:'手機',emoji:'📱',color:'#B08B6B',bg:'#F2E5D8'},

    sport:{name:'運動',emoji:'🏃',color:'#7B9B8B',bg:'#E0EBE5'},
    sleep:{name:'睡眠',emoji:'😴',color:'#8B7B9B',bg:'#E8E2EE'},
    fun:{name:'娛樂',emoji:'🎮',color:'#B89B72',bg:'#F0E6D2'},
    other:{name:'其他',emoji:'✨',color:'#A89B84',bg:'#EDE7DC'}
  };

  var AVATARS = ['👤','😀','😎','🤓','🧑‍🎓','👩‍🎓','👨‍🎓','🐱','🐶','🐼','🦊','🐯','🦁','🐸','🌸','🌟','🍀','🔥','💪','🎯','📚','✏️','💡','🎓'];

  var QUOTES = ['唔需要完美，只需要開始。','今日嘅努力，係聽日嘅底氣。','進步唔係直線，堅持就會見到。','就算慢，都唔好停低。','每一分鐘嘅專注，都係對未來嘅投資。','你今日做嘅事，決定你聽日企喺邊。','唔好同人比較，同昨日嘅自己比較。','休息都係計劃嘅一部分。','唔怕慢，只怕站。','失敗唔緊要，最緊要係再試。','你唔需要睇到成條樓梯，只需要踏出第一步。','天賦決定起點，努力決定終點。','而家唔係永遠，撐過去就會唔同。','你比自己想像中更堅強。','種一棵樹最好嘅時間係十年前，其次係而家。','成功唔係偶然，係每日嘅累積。','你今日嘅堅持，係聽日嘅自由。','努力唔一定有回報，但唔努力一定冇。','慢慢嚟，比較快。','你唔孤單，好多人喺後面撐你。','專注當下，唔好諗太多未來。','唔好等有心情先做，做咗就會有心情。','今日嘅辛苦，係聽日嘅故事。','你嘅極限，比你想像中遠。','想放棄嗰陣，已經行咗好遠。','與其焦慮，不如行動。','每日進步 1%，一年後就係 37 倍。','你唔需要贏晒所有人，只需要贏昨日嘅自己。','你嘅努力，會喺某一日開花。','捱得過今日，聽日就會好啲。','你可以休息，但唔可以放棄。','所有嘅努力，都會以另一種方式回報你。','想改變結果，就要改變行動。','唔好問自己得唔得，問自己肯唔肯。','當你覺得辛苦，就係進步緊嘅時候。','最黑暗嘅時候，就係最接近黎明嘅時候。','一步一腳印，冇捷徑。','你嘅對手，從來都係自己。','唔好怕孤單，成功嘅路都係一個人行。','努力嘅人，運氣都唔會太差。','你想要嘅生活，喺你唔想努力嘅背後。','唔好等到完美先開始，開始先會完美。','每一次跌倒，都係下次站得更穩嘅準備。','唔好停，因為你已經行咗咁遠。','你想去嘅地方，冇人能夠阻止你。','撐落去，係對自己最大嘅溫柔。'];

  var DEFAULT_SETTINGS = {daily:120, weekly:840, examDate:'2027-04-20'};
  function freshState(){
    return {
      records:[], dailyGoals:[], checkins:[], schedules:[], friends:[],
      settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),
      currentDate:null, calendarMonth:null, schCalendarMonth:null,
      quoteOfDay:null, quoteDate:null,
      profile:{displayName:'', avatar:'👤', friendCode:''},
      publicCheckins:[]
    };
  }
  var state = freshState();
  var currentUser = null;
  var unsubUser = null, unsubReqs = null;
  var friendsCache = {};
  var saveTimer = null;
  var schSelectedDate = today();
  var authMode = 'login';

  function userDocRef(){ return currentUser ? db.collection('users').doc(currentUser.uid) : null; }
  function publicDocRef(id){ return db.collection('public').doc(id || (currentUser ? currentUser.uid : '')); }

  function scheduleSave(){
    if(!firebaseReady || !currentUser) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 700);
  }

  function doSave(){
    if(!firebaseReady || !currentUser) return;
    if(state.chat && state.chat.length > 60) state.chat = state.chat.slice(-60);
    var cutoff = new Date(); cutoff.setDate(cutoff.getDate()-90);
    var cutStr = fmtDate(cutoff);
    state.publicCheckins = state.checkins.filter(function(c){ return c.date >= cutStr; }).map(function(c){ return c.date; });
    userDocRef().set({
      records: state.records, dailyGoals: state.dailyGoals,
      checkins: state.checkins, schedules: state.schedules,
      friends: state.friends, settings: state.settings,
      quoteOfDay: state.quoteOfDay, quoteDate: state.quoteDate,
      profile: state.profile,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true}).then(function(){
      return publicDocRef().set({
        uid: currentUser.uid,
        displayName: state.profile.displayName || currentUser.email,
        avatar: state.profile.avatar || '👤',
        friendCode: state.profile.friendCode || '',
        checkins: state.publicCheckins,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, {merge:true});
    }).catch(function(e){
      console.error('Save failed', e);
      toast('☁️ 同步失敗：' + (e.code || e.message), true);
    });
  }

  function applyRemote(data){
    state.records = data.records || [];
    state.dailyGoals = data.dailyGoals || [];
    state.checkins = data.checkins || [];
    state.schedules = data.schedules || [];
    state.friends = data.friends || [];
    state.settings = data.settings || JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    state.quoteOfDay = data.quoteOfDay || null;
    state.quoteDate = data.quoteDate || null;
    state.profile = data.profile || {displayName:'', avatar:'👤', friendCode:''};
    if(!state.currentDate) state.currentDate = today();
    if(!state.calendarMonth) state.calendarMonth = fmtMonth(new Date());
    if(!state.schCalendarMonth) state.schCalendarMonth = fmtMonth(new Date());
    if(!state.profile.friendCode){
      state.profile.friendCode = genCode();
      registerFriendCode(state.profile.friendCode);
      scheduleSave();
    }
    renderAll();
  }

  function renderAll(){
    renderHeader();
    renderCheckin();
    renderToday();
    renderSchedule();
    renderCalendar();
    renderFriends();
    renderGoals();
    renderSettings();
    initQuoteOfDay();
    updateDSE();
  }

  function registerFriendCode(code){
    if(!code || !firebaseReady || !currentUser) return;
    db.collection('friendCodes').doc(code).set({uid:currentUser.uid, email:currentUser.email}).catch(function(e){ console.warn(e); });
  }

  function attachUserSnapshot(){
    if(unsubUser) unsubUser();
    unsubUser = userDocRef().onSnapshot(function(snap){
      if(snap.metadata.hasPendingWrites) return;
      if(snap.exists) applyRemote(snap.data());
      else doSave();
    }, function(err){ console.error('snap', err); });
  }

  function attachRequestSnapshot(){
    if(unsubReqs) unsubReqs();
    unsubReqs = db.collection('friendRequests').doc(currentUser.uid).collection('inbox').onSnapshot(function(snap){
      var reqs = [];
      snap.forEach(function(d){ var o = d.data(); o.id = d.id; reqs.push(o); });
      renderRequests(reqs);
    }, function(err){ console.error('reqs', err); });
  }

  // ========== 登入 ==========
  $('#tabLogin').onclick = function(){
    authMode = 'login';
    $('#tabLogin').className = 'auth-tab active';
    $('#tabRegister').className = 'auth-tab';
    $('#authSubmit').textContent = '登入';
    $('#authMsg').textContent = '';
  };
  $('#tabRegister').onclick = function(){
    authMode = 'register';
    $('#tabLogin').className = 'auth-tab';
    $('#tabRegister').className = 'auth-tab active';
    $('#authSubmit').textContent = '註冊';
    $('#authMsg').textContent = '';
  };

  $('#authSubmit').onclick = function(){
    if(!firebaseReady){ toast('Firebase 未載入', true); return; }
    var email = $('#authEmail').value.trim();
    var pw = $('#authPassword').value;
    var msg = $('#authMsg');
    msg.className = 'auth-msg';
    if(!email || !pw){ msg.textContent = '請填寫 Email 同密碼'; msg.className = 'auth-msg err'; return; }
    if(pw.length < 6){ msg.textContent = '密碼最少 6 位'; msg.className = 'auth-msg err'; return; }
    var btn = $('#authSubmit');
    btn.disabled = true;
    btn.textContent = '處理中...';
    var promise = authMode === 'login' ? auth.signInWithEmailAndPassword(email, pw) : auth.createUserWithEmailAndPassword(email, pw);
    promise.catch(function(e){
      var map = {
        'auth/invalid-email':'Email 格式錯誤',
        'auth/user-not-found':'找唔到呢個帳號，請先註冊',
        'auth/wrong-password':'密碼錯誤',
        'auth/invalid-credential':'Email 或密碼錯誤',
        'auth/email-already-in-use':'呢個 Email 已經註冊過',
        'auth/weak-password':'密碼太弱',
        'auth/too-many-requests':'嘗試太多次',
        'auth/network-request-failed':'網絡問題',
        'auth/operation-not-allowed':'請去 Firebase 啟用 Email/密碼登入',
        'auth/unauthorized-domain':'呢個網域未授權'
      };
      msg.textContent = map[e.code] || ('錯誤：' + e.code);
      msg.className = 'auth-msg err';
    }).then(function(){
      btn.disabled = false;
      btn.textContent = authMode === 'login' ? '登入' : '註冊';
    });
  };

  $('#authPassword').addEventListener('keydown', function(e){
    if(e.key === 'Enter') $('#authSubmit').click();
  });

  $('#forgotBtn').onclick = function(){
    if(!firebaseReady){ toast('Firebase 未載入', true); return; }
    var email = $('#authEmail').value.trim();
    var msg = $('#authMsg');
    msg.className = 'auth-msg';
    if(!email){ msg.textContent = '請先輸入你嘅 Email'; msg.className = 'auth-msg err'; return; }
    if(!confirm('發送密碼重設連結去 ' + email + '？')) return;
    auth.sendPasswordResetEmail(email).then(function(){
      msg.textContent = '✅ 已發送重設連結，請去 Email 收信';
      msg.className = 'auth-msg ok';
    }).catch(function(e){
      msg.textContent = '發送失敗：' + (e.code || e.message);
      msg.className = 'auth-msg err';
    });
  };

  function handleAuthChange(user){
    if(user){
      currentUser = user;
      $('#authScreen').className = 'hide';
      $('#mainApp').style.display = '';
      $('#tabbar').style.display = '';
      userDocRef().get().then(function(snap){
        if(snap.exists){
          applyRemote(snap.data());
        }else{
          state.profile = {displayName:user.email.split('@')[0], avatar:'👤', friendCode:genCode()};
          state.currentDate = today();
          state.calendarMonth = fmtMonth(new Date());
          state.schCalendarMonth = fmtMonth(new Date());
          registerFriendCode(state.profile.friendCode);
          renderAll();
          doSave();
        }
        attachUserSnapshot();
        attachRequestSnapshot();
      }).catch(function(e){
        console.error(e);
        toast('載入失敗：' + (e.code || e.message), true);
      });
    }else{
      currentUser = null;
      if(unsubUser){ unsubUser(); unsubUser = null; }
      if(unsubReqs){ unsubReqs(); unsubReqs = null; }
      friendsCache = {};
      $('#authScreen').className = '';
      $('#mainApp').style.display = 'none';
      $('#tabbar').style.display = 'none';
      state = freshState();
    }
  }

  if(firebaseReady) auth.onAuthStateChanged(handleAuthChange);

  // ========== 頭像 ==========
  function renderHeader(){
    var btn = $('#avatarBtn');
    if(!btn) return;
    var av = state.profile.avatar || '👤';
    if(av.indexOf('data:') === 0) btn.innerHTML = '<img src="' + av + '">';
    else btn.textContent = av;
  }

  $('#avatarBtn').onclick = function(){
    var av = state.profile.avatar || '👤';
    var avHtml = av.indexOf('data:') === 0 ? '<img src="' + av + '">' : av;
    openModal(
      '<h3>個人資料</h3>' +
      '<div style="display:flex;flex-direction:column;align-items:center;margin-bottom:16px">' +
        '<div class="avatar-btn" style="width:72px;height:72px;font-size:36px">' + avHtml + '</div>' +
        '<div style="font-size:15px;font-weight:700;margin-top:8px">' + esc(state.profile.displayName || (currentUser ? currentUser.email : '')) + '</div>' +
        '<div style="font-size:12px;color:var(--text2)">' + (currentUser ? currentUser.email : '') + '</div>' +
      '</div>' +
      '<button type="button" class="menu-item" id="editProfile"><span class="em">✏️</span>編輯個人資料</button>' +
      '<button type="button" class="menu-item" id="changeEmail"><span class="em">📧</span>更改綁定 Email</button>' +
      '<button type="button" class="menu-item" id="changePw"><span class="em">🔒</span>更改密碼</button>' +
      '<button type="button" class="menu-item" id="logoutBtn" style="color:#8B4A2E"><span class="em">🚪</span>登出</button>' +
      '<div class="modal-actions"><button type="button" class="btn btn-soft" id="closeProfile">關閉</button></div>'
    );
    $('#closeProfile').onclick = closeModal;
    $('#editProfile').onclick = function(){ closeModal(); openEditProfile(); };
    $('#changeEmail').onclick = function(){ closeModal(); openChangeEmail(); };
    $('#changePw').onclick = function(){ closeModal(); openChangePw(); };
    $('#logoutBtn').onclick = function(){
      if(!confirm('登出 ' + currentUser.email + '？')) return;
      closeModal();
      auth.signOut();
    };
  };

  function openEditProfile(){
    var grid = '';
    for(var i=0;i<AVATARS.length;i++){
      var e = AVATARS[i];
      grid += '<button type="button" class="emoji-pick' + (state.profile.avatar === e ? ' sel' : '') + '" data-em="' + e + '">' + e + '</button>';
    }
    openModal(
      '<h3>編輯個人資料</h3>' +
      '<div class="field"><label>顯示名稱</label><input type="text" id="pName" value="' + esc(state.profile.displayName || '') + '" maxlength="20" placeholder="例如：小明"></div>' +
      '<div class="field"><label>選擇頭像</label><div class="emoji-grid" id="emojiGrid">' + grid + '</div></div>' +
      '<div class="field"><label>或上傳圖片</label><input type="file" id="avatarFile" accept="image/*"></div>' +
      '<div class="modal-actions">' +
        '<button type="button" class="btn btn-soft" id="epCancel">取消</button>' +
        '<button type="button" class="btn btn-primary" id="epSave">儲存</button>' +
      '</div>'
    );
    var chosen = state.profile.avatar;
    var picks = $('#emojiGrid').querySelectorAll('.emoji-pick');
    for(var j=0;j<picks.length;j++){
      picks[j].onclick = function(){
        chosen = this.getAttribute('data-em');
        for(var k=0;k<picks.length;k++) picks[k].className = 'emoji-pick';
        this.className = 'emoji-pick sel';
      };
    }
    $('#avatarFile').onchange = function(e){
      var f = e.target.files[0];
      if(!f) return;
      if(f.size > 100*1024){ toast('圖片要細過 100KB', true); return; }
      var reader = new FileReader();
      reader.onload = function(ev){
        var img = new Image();
        img.onload = function(){
          var c = document.createElement('canvas');
          c.width = 128; c.height = 128;
          var ctx = c.getContext('2d');
          var scale = Math.max(128/img.width, 128/img.height);
          var w = img.width*scale, h = img.height*scale;
          ctx.drawImage(img, (128-w)/2, (128-h)/2, w, h);
          chosen = c.toDataURL('image/jpeg', 0.8);
          for(var k=0;k<picks.length;k++) picks[k].className = 'emoji-pick';
          toast('圖片已載入，撳儲存');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(f);
    };
    $('#epCancel').onclick = closeModal;
    $('#epSave').onclick = function(){
      var name = $('#pName').value.trim();
      if(!name){ toast('請輸入名稱'); return; }
      state.profile.displayName = name;
      state.profile.avatar = chosen;
      if(currentUser) currentUser.updateProfile({displayName:name}).catch(function(e){ console.warn(e); });
      save();
      renderHeader();
      closeModal();
      toast('已更新');
    };
  }

  function openChangeEmail(){
    openModal(
      '<h3>更改綁定 Email</h3>' +
      '<div class="field"><label>目前 Email</label><input type="text" value="' + currentUser.email + '" disabled></div>' +
      '<div class="field"><label>新 Email</label><input type="email" id="newEmail" placeholder="new@example.com"></div>' +
      '<div class="field"><label>目前密碼</label><input type="password" id="pwForEmail"></div>' +
      '<div class="modal-actions">' +
        '<button type="button" class="btn btn-soft" id="ceCancel">取消</button>' +
        '<button type="button" class="btn btn-primary" id="ceSave">確認</button>' +
      '</div>'
    );
    $('#ceCancel').onclick = closeModal;
    $('#ceSave').onclick = function(){
      var newEmail = $('#newEmail').value.trim();
      var pw = $('#pwForEmail').value;
      if(!newEmail || !pw){ toast('請填寫所有欄位'); return; }

  // ========== 打卡 ==========
  function calcStreak(){
    var set = {};
    for(var i=0;i<state.checkins.length;i++) set[state.checkins[i].date] = 1;
    var s = 0;
    var d = new Date();
    if(!set[fmtDate(d)]) d.setDate(d.getDate()-1);
    while(set[fmtDate(d)]){ s++; d.setDate(d.getDate()-1); }
    return s;
  }

  function renderCheckin(){
    var t = today();
    var done = false;
    for(var i=0;i<state.checkins.length;i++) if(state.checkins[i].date === t) done = true;
    var streak = calcStreak();
    $('#checkinEm').textContent = done ? '✓' : '🔥';
    $('#checkinLbl').textContent = done ? '已打卡' : '打卡';
    $('#checkinBtn').className = 'checkin-btn' + (done ? ' done' : '');
    $('#checkinTitle').textContent = done ? '今日已完成打卡 🎉' : '撳一下完成今日打卡';
    $('#streakNum').textContent = streak;
    $('#totalNum').textContent = state.checkins.length;

  $('#checkinBtn').onclick = function(){
    var t = today();
    var idx = -1;
    for(var i=0;i<state.checkins.length;i++) if(state.checkins[i].date === t) idx = i;
    if(idx >= 0){
      if(!confirm('取消今日打卡？')) return;
      state.checkins.splice(idx, 1);
      save(); renderCheckin(); toast('已取消打卡');

      state.checkins.push({date:t, ts:Date.now()});

  // ========== 時間表 ==========
  function renderTimeline(){
    var hoursCol = $('#hoursCol');
    var track = $('#track');
    var date = state.currentDate || today();
    hoursCol.style.height = TRACK_HEIGHT + 'px';
    track.style.height = TRACK_HEIGHT + 'px';
    var hoursHtml = '';
    for(var h = START_HOUR; h <= END_HOUR; h++){
      var top = (h - START_HOUR) * 2 * SLOT_H;
      var label = h < 24 ? pad(h) + ':00' : pad(h-24) + ':00';
      hoursHtml += '<div class="hr" style="top:' + top + 'px">' + label + '</div>';
    }
    hoursCol.innerHTML = hoursHtml;
    track.innerHTML = '';
    var recs = state.records.filter(function(r){ return r.date === date; }).sort(function(a,b){ return a.startMin - b.startMin; });
    for(var i=0;i<recs.length;i++){
      var r = recs[i];
      var c = catInfo(r.catId);
      var top2 = (r.startMin - START_HOUR*60) / 30 * SLOT_H;
      var dur = Math.max(30, r.endMin - r.startMin);
      var height = Math.max(30, dur/30*SLOT_H - 4);
      if(top2 < -SLOT_H || top2 > TRACK_HEIGHT) continue;
      var el = document.createElement('div');
      el.className = 'block';
      el.style.top = Math.max(0, top2) + 'px';
      el.style.height = height + 'px';
      el.style.background = c.bg;
      el.style.borderLeft = '3px solid ' + c.color;
      el.setAttribute('data-id', r.id);
      el.innerHTML = '<div class="bn">' + c.emoji + ' ' + esc(r.name) + '</div>' +
        (height > 38 ? '<div class="bt">' + minToTime(r.startMin) + ' – ' + minToTime(r.endMin) + ' · ' + dur + '分</div>' : '');
      (function(rec){
        el.onclick = function(e){ e.stopPropagation(); openTaskModal(rec); };
      })(r);
      track.appendChild(el);
    }
    var s = 0, p = 0, o = 0;
    for(var k=0;k<recs.length;k++){
      var rr = recs[k];
      var d = rr.endMin - rr.startMin;
      if(rr.catId === 'study') s += d;
      else if(rr.catId === 'phone') p += d;
      else o += d;
    }
    $('#statStudy').textContent = s;
    $('#statPhone').textContent = p;
    $('#statOther').textContent = o;
    $('#recCount').textContent = recs.length + ' 條';
    renderRecList(recs);
  }

  // ========== 日程 ==========
  function renderSchedule(){
    if(!state.schCalendarMonth) state.schCalendarMonth = fmtMonth(new Date());
    var p = state.schCalendarMonth.split('-');
    var y = Number(p[0]), m = Number(p[1]);
    $('#schCalTitle').textContent = y + ' 年 ' + m + ' 月';
    var first = new Date(y, m-1, 1);
    var startW = first.getDay();
    var daysInMonth = new Date(y, m, 0).getDate();
    var prevDays = new Date(y, m-1, 0).getDate();
    var cells = [];
    for(var i=startW-1; i>=0; i--) cells.push({d:new Date(y, m-2, prevDays-i), other:true});
    for(var j=1; j<=daysInMonth; j++) cells.push({d:new Date(y, m-1, j), other:false});
    var needed = cells.length <= 35 ? 35 : 42;
    while(cells.length < needed){
      var idx = cells.length - (startW + daysInMonth) + 1;
      cells.push({d:new Date(y, m, idx), other:true});
    }
    var t = today();
    var schSet = {};
    for(var a=0;a<state.schedules.length;a++) schSet[state.schedules[a].date] = 1;
    var html = '';
    for(var b=0;b<cells.length;b++){
      var cell = cells[b];
      var ds = fmtDate(cell.d);
      var cls = 'cal-day';
      if(cell.other) cls += ' other';
      if(ds === t) cls += ' today';
      if(ds === schSelectedDate) cls += ' sel';
      if(schSet[ds]) cls += ' check';
      html += '<button type="button" class="' + cls + '" data-date="' + ds + '">' + cell.d.getDate() + '</button>';
    }
    $('#schCalGrid').innerHTML = html;
    var days = $('#schCalGrid').querySelectorAll('.cal-day');
    for(var c=0;c<days.length;c++){

    var box = $('#schList');
    if(list.length === 0){
      box.innerHTML = '<div class="empty">呢日未有行程</div>';

    var cells = [];
    for(var i=startW-1; i>=0; i--) cells.push({d:new Date(y, m-2, prevDays-i), other:true});
    for(var j=1; j<=daysInMonth; j++) cells.push({d:new Date(y, m-1, j), other:false});
    var needed = cells.length <= 35 ? 35 : 42;
    while(cells.length < needed){
      var idx = cells.length - (startW + daysInMonth) + 1;
      cells.push({d:new Date(y, m, idx), other:true});
    }
    var t = today();
    var chkSet = {};
    for(var a=0;a<state.checkins.length;a++) chkSet[state.checkins[a].date] = 1;
    var html = '';
    for(var b=0;b<cells.length;b++){
      var cell = cells[b];
      var ds = fmtDate(cell.d);
      var hasRec = false;
      for(var c=0;c<state.records.length;c++) if(state.records[c].date === ds){ hasRec = true; break; }
      var cls = 'cal-day';
      if(cell.other) cls += ' other';
      if(ds === t) cls += ' today';
      if(ds === state.currentDate) cls += ' sel';
      if(hasRec) cls += ' dot';
      if(chkSet[ds]) cls += ' check';
      html += '<button type="button" class="' + cls + '" data-date="' + ds + '">' + cell.d.getDate() + '</button>';
    }
    $('#calGrid').innerHTML = html;
    var days = $('#calGrid').querySelectorAll('.cal-day');
    for(var d=0;d<days.length;d++){
      (function(el){
        el.onclick = function(){
          state.currentDate = el.getAttribute('data-date');
          save();
          for(var i=0;i<tabs.length;i++) tabs[i].className = 'tab' + (tabs[i].getAttribute('data-page') === 'today' ? ' active' : '');
          var pages = $$('.page');
          for(var j=0;j<pages.length;j++) pages[j].className = 'page' + (pages[j].id === 'page-today' ? ' active' : '');
          renderToday();
          window.scrollTo(0,0);
          toast('已打開 ' + el.getAttribute('data-date'));
        };
      })(days[d]);
    }
  }
  $('#calPrev').onclick = function(){
    var p = state.calendarMonth.split('-');
    state.calendarMonth = fmtMonth(new Date(Number(p[0]), Number(p[1])-2, 1));
    save(); renderCalendar();
  };
  $('#calNext').onclick = function(){
    var p = state.calendarMonth.split('-');
    state.calendarMonth = fmtMonth(new Date(Number(p[0]), Number(p[1]), 1));
    save(); renderCalendar();
  };
  $('#calToday').onclick = function(){
    state.calendarMonth = fmtMonth(new Date());
    state.currentDate = today();
    save(); renderCalendar();
  };

  // ========== 目標 ==========
  function renderGoals(){
    var grid = $('#goalDayGrid');
    var days = [];
    var base = new Date();
    for(var i=0;i<6;i++){ var d = new Date(base); d.setDate(base.getDate()-i); days.push(fmtDate(d)); }
    var t = today();
    var html = '';
    for(var j=0;j<days.length;j++){
      var ds = days[j];
      var goals = state.dailyGoals.filter(function(g){ return g.date === ds; });
      var items = '';
      for(var k=0;k<goals.length;k++){
        var g = goals[k];
        items += '<div class="goal-mini' + (g.done ? ' done' : '') + '" data-toggle="' + g.id + '">' +
          '<span class="goal-check' + (g.done ? ' done' : '') + '">✓</span>' +
          '<span>' + esc(g.text) + '</span>' +
        '</div>';
      }
      var dObj = new Date(ds + 'T00:00:00');
      html += '<div class="goal-day">' +
        '<div class="goal-day-head">' +
          '<span class="goal-day-date">' + (dObj.getMonth()+1) + '/' + dObj.getDate() + '</span>' +
          (ds === t ? '<span class="goal-day-badge">今</span>' : '') +
        '</div>' +
        (items || '<div style="font-size:11px;color:var(--text2)">（未有目標）</div>') +
        '<button type="button" class="goal-add-mini" data-add="' + ds + '">＋ 新增</button>' +
      '</div>';
    }
    grid.innerHTML = html;
    var togs = grid.querySelectorAll('[data-toggle]');
    for(var a=0;a<togs.length;a++){
      (function(el){
        el.onclick = function(){
          var id = el.getAttribute('data-toggle');
          for(var m=0;m<state.dailyGoals.length;m++){
            if(state.dailyGoals[m].id === id){ state.dailyGoals[m].done = !state.dailyGoals[m].done; break; }
          }
          save(); renderGoals();
        };
      })(togs[a]);
    }
    var adds = grid.querySelectorAll('[data-add]');
    for(var b=0;b<adds.length;b++){
      (function(el){
        el.onclick = function(){
          var date = el.getAttribute('data-add');
          openModal(
            '<h3>新增日目標（' + date + '）</h3>' +
            '<div class="field"><label>目標內容</label><input type="text" id="gText" placeholder="例如：完成數學卷 1"></div>' +
            '<div class="modal-actions">' +
              '<button type="button" class="btn btn-soft" id="gCancel">取消</button>' +
              '<button type="button" class="btn btn-primary" id="gSave">新增</button>' +
            '</div>'
          );
          $('#gCancel').onclick = closeModal;
          setTimeout(function(){ var el2 = $('#gText'); if(el2) el2.focus(); }, 100);
          $('#gSave').onclick = function(){
            var text = $('#gText').value.trim();
            if(!text){ toast('請輸入目標'); return; }
            state.dailyGoals.push({id:uid(), date:date, text:text, done:false});
            save(); closeModal(); renderGoals(); toast('已新增');
          };
        };
      })(adds[b]);
    }
  }

  // ========== 好友 ==========
  function loadFriendProfile(id){
    if(friendsCache[id]) return Promise.resolve(friendsCache[id]);
    return publicDocRef(id).get().then(function(s){
      if(s.exists){ friendsCache[id] = s.data(); return friendsCache[id]; }
      return null;
    }).catch(function(e){ console.warn(e); return null; });
  }

  function renderFriends(){
    if(!state.profile.friendCode) return;
    $('#myFriendCode').textContent = state.profile.friendCode;
    $('#friendCount').textContent = state.friends.length + ' 位';
    var list = $('#friendList');
    if(state.friends.length === 0){
      list.innerHTML = '<div class="empty">未有好友，撳上面「用好友碼加好友」</div>';
      return;
    }
    list.innerHTML = '<div class="empty">載入中...</div>';
    var promises = state.friends.map(function(u){ return loadFriendProfile(u); });
    Promise.all(promises).then(function(profiles){
      var t = today();
      var html = '';
      for(var i=0;i<profiles.length;i++){
        var p = profiles[i];
        if(!p) continue;
        var id = state.friends[i];
        var checked = (p.checkins || []).indexOf(t) >= 0;
        var av = p.avatar || '👤';
        var avHtml = av.indexOf('data:') === 0 ? '<img src="' + av + '">' : av;
        html += '<div class="friend-item" data-uid="' + id + '">' +
          '<div class="friend-avatar">' + avHtml + '</div>' +
          '<div class="friend-info">' +
            '<div class="friend-name">' + esc(p.displayName || '用戶') + '</div>' +
            '<div class="friend-status' + (checked ? ' done' : '') + '">' + (checked ? '✅ 今日已打卡' : '未打卡') + '</div>' +
          '</div>' +
        '</div>';
      }
      list.innerHTML = html || '<div class="empty">載入失敗</div>';
      var items = list.querySelectorAll('.friend-item');
      for(var j=0;j<items.length;j++){
        (function(el){
          el.onclick = function(){ openFriendDetail(el.getAttribute('data-uid')); };
        })(items[j]);
      }
    });
  }

  function openFriendDetail(id){
    loadFriendProfile(id).then(function(p){
      if(!p){ toast('載入失敗', true); return; }
      var t = today();
      var checked = (p.checkins || []).indexOf(t) >= 0;
      var set = {};
      for(var i=0;i<(p.checkins || []).length;i++) set[p.checkins[i]] = 1;
      var streak = 0;
      var dd = new Date();
      if(!set[fmtDate(dd)]) dd.setDate(dd.getDate()-1);
      while(set[fmtDate(dd)]){ streak++; dd.setDate(dd.getDate()-1); }
      var av = p.avatar || '👤';
      var avHtml = av.indexOf('data:') === 0 ? '<img src="' + av + '">' : av;
      var heat = '';
      for(var j=29; j>=0; j--){
        var d2 = new Date(); d2.setDate(d2.getDate()-j);
        var ds = fmtDate(d2);
        var on = set[ds];
        heat += '<div style="width:14px;height:14px;border-radius:4px;background:' + (on ? 'var(--accent)' : '#E8DFCC') + '" title="' + ds + '"></div>';
      }
      openModal(
        '<div style="text-align:center;margin-bottom:16px">' +
          '<div class="avatar-btn" style="width:72px;height:72px;font-size:36px;margin:0 auto">' + avHtml + '</div>' +
          '<div style="font-size:17px;font-weight:700;margin-top:10px">' + esc(p.displayName || '用戶') + '</div>' +
          '<div style="font-size:13px;color:var(--text2);margin-top:4px">' + (checked ? '✅ 今日已打卡' : '💤 今日未打卡') + '</div>' +
          '<div style="font-size:13px;color:var(--accent-d);font-weight:600;margin-top:6px">🔥 連續 ' + streak + ' 日</div>' +
        '</div>' +
        '<div class="card" style="box-shadow:none;background:var(--soft);margin-bottom:12px">' +
          '<div style="font-size:13px;font-weight:700;margin-bottom:8px">最近 30 日打卡</div>' +
          '<div style="display:flex;gap:4px;flex-wrap:wrap">' + heat + '</div>' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button type="button" class="btn btn-soft" id="fdClose">關閉</button>' +
          '<button type="button" class="btn btn-danger" id="fdRemove">移除好友</button>' +
        '</div>'
      );
      $('#fdClose').onclick = closeModal;
      $('#fdRemove').onclick = function(){
        if(!confirm('確定移除呢個好友？')) return;
        state.friends = state.friends.filter(function(x){ return x !== id; });
        save(); closeModal(); renderFriends(); toast('已移除');
      };
    });
  }

  $('#copyCodeBtn').onclick = function(){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(state.profile.friendCode).then(function(){
        toast('已複製好友碼');
      }).catch(function(){ toast('好友碼：' + state.profile.friendCode); });
    }else{
      toast('好友碼：' + state.profile.friendCode);
    }
  };

  $('#addFriendBtn').onclick = function(){
    openModal(
      '<h3>加好友</h3>' +
      '<div class="field"><label>輸入對方嘅 6 位好友碼</label>' +
        '<input type="text" id="afCode" placeholder="ABC123" maxlength="6" style="text-transform:uppercase;letter-spacing:4px;font-size:20px;text-align:center"></div>' +
      '<div class="modal-actions">' +
        '<button type="button" class="btn btn-soft" id="afCancel">取消</button>' +
        '<button type="button" class="btn btn-primary" id="afSend">發送請求</button>' +
      '</div>'
    );
    $('#afCancel').onclick = closeModal;
    $('#afSend').onclick = function(){
      var code = $('#afCode').value.trim().toUpperCase();
      if(code.length !== 6){ toast('好友碼係 6 位'); return; }
      if(code === state.profile.friendCode){ toast('唔可以加自己', true); return; }
      db.collection('friendCodes').doc(code).get().then(function(s){
        if(!s.exists){ toast('搵唔到呢個好友碼', true); return; }
        var toUid = s.data().uid;
        if(state.friends.indexOf(toUid) >= 0){ toast('已經係好友'); closeModal(); return; }
        return db.collection('friendRequests').doc(toUid).collection('inbox').doc(currentUser.uid).set({
          fromUid: currentUser.uid,
          fromName: state.profile.displayName || currentUser.email,
          fromAvatar: state.profile.avatar || '👤',
          ts: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function(){
          toast('✅ 已發送請求');
          closeModal();
        });
      }).catch(function(e){
        toast('失敗：' + (e.code || e.message), true);
      });
    };
  };

  function renderRequests(reqs){
    $('#reqCount').textContent = reqs.length ? reqs.length + ' 個' : '';
    var box = $('#reqList');
    if(reqs.length === 0){
      box.innerHTML = '<div class="empty">暫時冇新請求</div>';
      return;
    }
    var html = '';
    for(var i=0;i<reqs.length;i++){
      var r = reqs[i];
      var av = r.fromAvatar || '👤';
      var avHtml = av.indexOf('data:') === 0 ? '<img src="' + av + '">' : av;
      html += '<div class="friend-item">' +
        '<div class="friend-avatar">' + avHtml + '</div>' +
        '<div class="friend-info">' +
          '<div class="friend-name">' + esc(r.fromName || '用戶') + '</div>' +
          '<div class="friend-status">想加你做朋友</div>' +
        '</div>' +
        '<button type="button" class="btn btn-primary" style="padding:8px 14px;min-height:36px;font-size:13px;width:auto;margin:0" data-accept="' + r.id + '">接受</button>' +
        '<button type="button" class="btn btn-soft" style="padding:8px 14px;min-height:36px;font-size:13px;width:auto;margin:0" data-reject="' + r.id + '">拒絕</button>' +
      '</div>';
    }
    box.innerHTML = html;
    var accepts = box.querySelectorAll('[data-accept]');
    for(var j=0;j<accepts.length;j++){
      (function(b){
        b.onclick = function(){
          var fromUid = b.getAttribute('data-accept');
          if(state.friends.indexOf(fromUid) < 0) state.friends.push(fromUid);
          save();
          db.collection('friendRequests').doc(currentUser.uid).collection('inbox').doc(fromUid).delete().then(function(){
            return db.collection('users').doc(fromUid).get();
          }).then(function(snap){
            if(snap.exists){
              var data = snap.data();
              var list = data.friends || [];
              if(list.indexOf(currentUser.uid) < 0) list.push(currentUser.uid);
              return db.collection('users').doc(fromUid).set({friends:list}, {merge:true});
            }
          }).catch(function(e){ console.warn(e); });
          toast('✅ 已成為好友');
          renderFriends();
        };
      })(accepts[j]);
    }
    var rejects = box.querySelectorAll('[data-reject]');
    for(var k=0;k<rejects.length;k++){
      (function(b){
        b.onclick = function(){
          db.collection('friendRequests').doc(currentUser.uid).collection('inbox').doc(b.getAttribute('data-reject')).delete().catch(function(e){ console.warn(e); });
          toast('已拒絕');
        };
      })(rejects[k]);
    }
  }

  // ========== 設定 ==========
  function renderSettings(){
    $('#setDaily').value = state.settings.daily;
    $('#setWeekly').value = state.settings.weekly;
    $('#setExam').value = state.settings.examDate;
    $('#storageInfo').textContent = (currentUser ? currentUser.email : '—') + ' · ' + state.records.length + ' 條記錄 · ' + state.checkins.length + ' 日打卡 · ☁️';
  }
  $('#setDaily').onchange = function(){ state.settings.daily = Number(this.value)||0; save(); };
  $('#setWeekly').onchange = function(){ state.settings.weekly = Number(this.value)||0; save(); };
  $('#setExam').onchange = function(){ state.settings.examDate = this.value; save(); updateDSE(); };

  $('#btnExport').onclick = function(){
    var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'study-vision-' + today() + '.json';
    a.click(); URL.revokeObjectURL(url);
    toast('已匯出');
  };
  $('#btnClear').onclick = function(){
    if(!confirm('⚠️ 確定清空所有資料？')) return;
    if(!confirm('最後確認？')) return;
    state = freshState();
    state.profile = {displayName:'', avatar:'👤', friendCode:genCode()};
    state.currentDate = today();
    state.calendarMonth = fmtMonth(new Date());
    state.schCalendarMonth = fmtMonth(new Date());
    registerFriendCode(state.profile.friendCode);
    save(); renderAll(); toast('已清空');
  };

  function updateDSE(){
    var d = new Date(state.settings.examDate);
    var diff = Math.ceil((d - new Date()) / 86400000);
    $('#dseDays').textContent = diff > 0 ? diff : '0';
  }

  console.log('Study Vision ready');
});
</script>
</body>
</html>
